# pre-commit hook definition.
#
# Usage (drop this into your own .pre-commit-config.yaml):
#
#   - repo: https://github.com/simin-yuan/self-auditing-agent
#     rev: v0.4
#     hooks:
#       - id: gatecheck
#         args:
#           - "--gate=python validate.py {target}"
#           - "--target=fixtures/known-good"
#
# What it does: takes a **known-good** input, breaks it into hundreds of variants,
# drives each one at your gate, and reports which rewrites your gate fails to
# react to. It is "checking your checking".
#
# Why language: system -- gatecheck has zero dependencies (Python standard library
# only), so there is no virtualenv to build and nothing to install. Every extra
# installation step is one more failure point.
- id: gatecheck
  name: gatecheck — does your gate actually reject anything?
  description: >
    Mutates a known-good baseline and reports which mutations your quality gate
    fails to reject. Pass --gate and --target via args.
  entry: python gatecheck/gatecheck.py
  language: system
  pass_filenames: false
  always_run: true
  args:
    - "--report=gatecheck-report.json"
