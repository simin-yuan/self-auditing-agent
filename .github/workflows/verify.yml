name: Verify the archive

# What this archive claims is that "every conclusion can be reproduced by a third party".
# So it has to be reproduced on every push -- the claim cannot live only in the README.
#
# Two kinds of "red" are kept deliberately separate here:
#   (1) the claimed symmetry broke (the gate cannot say no / or can only say no) -> CI must go red
#   (2) the blind-spot count moved (how many misses gatecheck found)             -> recorded only, CI stays green
# Reason: the miss count moves with the input and the operators, so making it a gate would manufacture
# false alarms; but "does the baseline still pass" is a hard fact -- if it breaks, the claim is broken, and
# that must go red.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  repro:
    name: Two commands · clean machine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: (1) The gate must be able to say no -- and to say yes
        run: python repro/verify_gate.py

      - name: (2) Reproduce the core finding (a gap in a read-only SQL interface)
        run: python repro/verify_sql_gap.py

      - name: (3) Rebuild the legal baseline (proving the baseline is reproducible, not hand-made)
        run: |
          python repro/fixtures/make_valid.py
          python repro/verify_gate.py

  gatecheck:
    name: Health-check our own gate
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Mutate 175 inputs and drive each one at the gate
        run: |
          python gatecheck/gatecheck.py \
            --gate "python repro/validate_meta_model.py {target} --source repro/fixtures/valid-source" \
            --target repro/fixtures/valid-meta-model \
            --workers 4 --timeout 60 \
            --report gatecheck-report.json || true

      - name: Assert the baseline still holds (this one really can turn CI red)
        run: |
          python - <<'PY'
          import json, sys
          r = json.load(open("gatecheck-report.json", encoding="utf-8"))
          print(f"  baseline_ok : {r['baseline_ok']}")
          print(f"  mutants     : {r['mutants_total']}")
          print(f"  caught      : {len(r['caught'])}")
          print(f"  missed      : {len(r['missed'])}")
          if not r["baseline_ok"]:
              print("::error::the gate no longer passes even a legal baseline -- the claim is broken")
              sys.exit(1)
          if r["mutants_total"] < 100:
              print("::error::mutant count suspiciously low -- the health check itself may have failed")
              sys.exit(1)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: gatecheck-report
          path: gatecheck-report.json
