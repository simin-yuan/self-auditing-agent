[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gatecheck"
version = "1.0.0"
description = "Does your gate actually reject anything? Mutates the input, drives every variant at your validator, and reports what it misses."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["testing", "mutation-testing", "linter", "validation", "ci", "quality-gate"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
# The only dependency is the Python standard library, and that is deliberate:
# a quality tool that makes people install a pile of things first will not end up
# on anybody's critical path.
dependencies = []

[project.scripts]
gatecheck = "gatecheck:main"

[tool.setuptools]
py-modules = ["gatecheck"]
